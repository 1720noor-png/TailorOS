<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vimztools – 1,000 Free Everyday Tools That Run in Your Browser</title>
    <meta name="description" content="Over 1,000 free, private online tools for developers, students, finance, design, office, and daily life. 100% client-side with zero data uploads." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vimztools-app.netlify.app/" />
    <meta property="og:title" content="Vimztools – 1,000 Free In-Browser Web Utilities" />
    <meta property="og:description" content="Privacy-first, zero-signup utility platform with 1,000 tools across 103 categories. All calculations run locally in your browser." />
    <meta property="og:image" content="https://vimztools-app.netlify.app/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vimztools – 1,000 Free In-Browser Web Utilities" />
    <meta name="twitter:description" content="Privacy-first, zero-signup utility platform with 1,000 tools across 103 categories. All calculations run locally in your browser." />

    <!-- Theme & App Manifest -->
    <meta name="theme-color" content="#0B5FFF" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@600;700;800&display=swap" rel="stylesheet" />
    
    <script>
      try {
        var t = localStorage.getItem('toolhub-theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
